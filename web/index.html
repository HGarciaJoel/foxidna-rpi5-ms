<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>foxidna</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f0f0f;
            --bg-card: #272727;
            --text-main: #f1f1f1;
            --text-muted: #aaaaaa;
            --accent-pink: #FF00CC;
            --accent-crimson: #FF004D;
            --accent-purple: #B300FF;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 30px 40px;
        }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }
        .logo {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(45deg, var(--accent-pink), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }
        .grid-container {
            display: grid;
            /* Cuadrícula responsiva enfocada en PC */
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }
        .video-card {
            background-color: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
        }
        /* Animación de elevación y brillo de neón al pasar el cursor */
        .video-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 12px 25px rgba(255, 0, 204, 0.15);
        }
        .thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #1a1a1a, #333);
            position: relative;
            overflow: hidden;
        }
        /* Reflejo animado sobre la miniatura */
        .thumbnail::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.08), transparent);
            transform: skewX(-20deg);
            transition: left 0.6s ease;
        }
        .video-card:hover .thumbnail::after {
            left: 150%;
        }
        .card-content {
            padding: 16px;
        }
        .video-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 6px 0;
            line-height: 1.4;
        }
        .video-meta {
            font-size: 14px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">foxidna</div>
    </div>
    
    <div class="grid-container">
        <!-- El enlace pasa el parámetro ?v=video1 al reproductor maestro -->
        <a href="player.html?v=video1" class="video-card">
            <div class="thumbnail"></div>
            <div class="card-content">
                <h3 class="video-title">Video de prueba</h3>
                <div class="video-meta">Servidor Local</div>
            </div>
        </a>
        
        <a href="player.html?v=video2" class="video-card">
            <div class="thumbnail"></div>
            <div class="card-content">
                <h3 class="video-title">Coliseo de los incensatos</h3>
                <div class="video-meta">Servidor Local</div>
            </div>
        </a>
   	<a href="player.html?v=HowToVoidVessel" class="video-card">
            <div class="thumbnail"></div>
            <div class="card-content">
                <h3 class="video-title">Tutorial como vencer a vasija pura </h3>
                <div class="video-meta">Servidor Local</div>
            </div>
        </a>
	<a href="player.html?v=manyBosses" class="video-card">
            <div class="thumbnail"></div>
            <div class="card-content">
                <h3 class="video-title">Muchos jefes</h3>
                <div class="video-meta">Servidor Local</div>
            </div>
        </a>
    </div>
</body>
</html>
